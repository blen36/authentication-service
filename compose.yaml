name: authentication-service

# Reuse the existing PostgreSQL service and its persistent volume.
include:
  - compose.auth-db.yaml

services:
  auth-service:
    image: authentication-service:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      APP_PORT: "8081"
      AUTH_DB_URL: jdbc:postgresql://auth-postgres:5432/authentication_service_db
      AUTH_DB_USERNAME: "${AUTH_DB_USERNAME:?Set AUTH_DB_USERNAME in .env}"
      AUTH_DB_PASSWORD: "${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}"
      AUTH_REGISTRATION_KEY: "${AUTH_REGISTRATION_KEY:?Set AUTH_REGISTRATION_KEY in .env}"
      AUTH_BOOTSTRAP_ENABLED: "false"
      JWT_PRIVATE_KEY: file:/run/secrets/auth-private-key.pem
      JWT_PUBLIC_KEY: file:/run/secrets/auth-public-key.pem
      JWT_ACCESS_TTL_SECONDS: "${JWT_ACCESS_TTL_SECONDS:-900}"
      JWT_REFRESH_TTL_SECONDS: "${JWT_REFRESH_TTL_SECONDS:-604800}"
    depends_on:
      auth-postgres:
        condition: service_healthy
    secrets:
      - source: auth_private_key
        target: auth-private-key.pem
      - source: auth_public_key
        target: auth-public-key.pem
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "--output", "/dev/null", "http://localhost:8081/api/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

secrets:
  auth_private_key:
    file: ./secrets/private-key.pem
  auth_public_key:
    file: ./secrets/public-key.pem
