name: authentication-service

services:
  auth-postgres:
    image: postgres:16-alpine

    ports:
      - "127.0.0.1:5433:5432"

    environment:
      POSTGRES_DB: authentication_service_db
      POSTGRES_USER: "${AUTH_DB_USERNAME:?Set AUTH_DB_USERNAME in .env}"
      POSTGRES_PASSWORD: "${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}"

    volumes:
      - auth_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  auth_postgres_data: