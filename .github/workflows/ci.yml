name: Authentication Service CI

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    name: Build, test, analyze and create image
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check environment
        run: |
          bash ./mvnw --version
          docker info

      # Compile production and test code without running tests yet.
      - name: Build
        run: bash ./mvnw -B -ntp clean test-compile

      # All existing *Test and *Tests classes are discovered by Surefire.
      # Testcontainers starts PostgreSQL; no working DB credentials are needed.
      - name: Testing
        run: bash ./mvnw -B -ntp verify

      - name: Save test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.sha }}
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: warn
          retention-days: 7

      - name: Check SonarQube configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          for setting in SONAR_TOKEN SONAR_ORGANIZATION SONAR_PROJECT_KEY; do
            if [[ -z "${!setting}" ]]; then
              echo "::error::Missing $setting. See README.md."
              exit 1
            fi
          done
          test -s target/site/jacoco/jacoco.xml

      # EU SonarQube Cloud. On Free, this Git branch must be the project's
      # main branch in SonarQube. See the guide before the first push.
      - name: Code Analysis (SonarQube)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: >-
          bash ./mvnw -B -ntp
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          "-Dsonar.host.url=https://sonarcloud.io"
          "-Dsonar.organization=$SONAR_ORGANIZATION"
          "-Dsonar.projectKey=$SONAR_PROJECT_KEY"
          "-Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml"
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=300

      # Build only after tests AND the quality gate pass.
      # This is a downloadable image, not a deployment or a registry push.
      - name: Artefact Creation (Docker image)
        run: |
          docker build --tag "authentication-service:$GITHUB_SHA" .
          docker image inspect "authentication-service:$GITHUB_SHA" > target/docker-image-metadata.json
          docker save "authentication-service:$GITHUB_SHA" | gzip > target/authentication-service-image.tar.gz

      - name: Save Docker image
        uses: actions/upload-artifact@v7
        with:
          name: authentication-service-image-${{ github.sha }}
          path: |
            target/authentication-service-image.tar.gz
            target/docker-image-metadata.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
