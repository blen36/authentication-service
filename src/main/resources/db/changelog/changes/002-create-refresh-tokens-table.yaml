databaseChangeLog:
- changeSet:
    id: 002-create-refresh-tokens-table
    author: vlad
    changes:
    - createTable:
        tableName: refresh_tokens
        columns:
        - column:
            name: id
            type: UUID
            constraints:
              primaryKey: true
              nullable: false
        - column:
            name: credential_id
            type: BIGINT
            constraints:
              nullable: false
        - column:
            name: token_hash
            type: VARCHAR(64)
            constraints:
              nullable: false
              unique: true
        - column:
            name: expires_at
            type: TIMESTAMP WITH TIME ZONE
            constraints:
              nullable: false
        - column:
            name: consumed
            type: BOOLEAN
            defaultValueBoolean: false
            constraints:
              nullable: false
    - addForeignKeyConstraint:
        constraintName: fk_refresh_tokens_credential
        baseTableName: refresh_tokens
        baseColumnNames: credential_id
        referencedTableName: credentials
        referencedColumnNames: id
        onDelete: CASCADE
    - createIndex:
        tableName: refresh_tokens
        indexName: idx_refresh_tokens_credential_id
        columns:
        - column:
            name: credential_id
    - createIndex:
        tableName: refresh_tokens
        indexName: idx_refresh_tokens_expires_at
        columns:
        - column:
            name: expires_at
