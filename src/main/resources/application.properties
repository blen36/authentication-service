spring.application.name=authentication-service
server.port=${APP_PORT:8081}
spring.profiles.default=local

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

auth.jwt.issuer=authentication-service
auth.jwt.audience=java-advanced-api
auth.jwt.access-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:900}
auth.jwt.refresh-ttl-seconds=${JWT_REFRESH_TTL_SECONDS:604800}
auth.jwt.private-key=${JWT_PRIVATE_KEY:file:./secrets/private-key.pem}
auth.jwt.public-key=${JWT_PUBLIC_KEY:file:./secrets/public-key.pem}
auth.provisioning.key=${AUTH_REGISTRATION_KEY}
auth.registration-key=${AUTH_REGISTRATION_KEY}

auth.bootstrap.enabled=${AUTH_BOOTSTRAP_ENABLED:false}
